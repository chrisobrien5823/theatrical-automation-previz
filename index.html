<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="description" content="Browser previz of stage automation cues with clearance checking." />
    <title>Stage Automation Previz</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0e12'/%3E%3Ccircle cx='16' cy='18' r='9' fill='none' stroke='%23ffb020' stroke-width='3'/%3E%3Crect x='9' y='5' width='14' height='4' fill='%233fd17a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div id="viewport" aria-label="3D stage view"></div>
        <header class="hud">
          <div class="hud-title"><span class="dot" id="statusDot"></span><span id="showName">Loading…</span></div>
          <div class="hud-cue"><span id="hudCue">Ready</span> <span id="hudTime" class="mono"></span></div>
        </header>
        <div id="alert" class="alert" role="status" aria-live="polite" hidden></div>
        <div class="cams" id="cams" aria-label="Camera presets"></div>
      </main>

      <aside id="panel">
        <div class="standby">
          <span class="label">Standby</span>
          <span id="standby" class="standby-cue">—</span>
        </div>
        <div class="transport">
          <button id="go" class="btn btn-go" title="GO (Space)">GO</button>
          <button id="stop" class="btn btn-stop" title="STOP (Esc)">STOP</button>
          <button id="reset" class="btn btn-reset" title="RESET (R)">RESET</button>
        </div>
        <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="cues" aria-selected="true">Cues</button>
          <button role="tab" data-tab="axes" aria-selected="false">Axes</button>
          <button role="tab" data-tab="log" aria-selected="false">Log <span id="logCount" class="count" hidden></span></button>
        </nav>
        <section class="tab" id="tab-cues"><ol id="cueList" class="cue-list"></ol></section>
        <section class="tab" id="tab-axes" hidden><div id="axes" class="axes"></div></section>
        <section class="tab" id="tab-log" hidden>
          <ul id="log" class="log"></ul>
        </section>

        <footer class="panel-foot">
          <label class="speed">Speed
            <select id="speed">
              <option value="1">1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
          <label class="file-btn">Load show…<input id="fileInput" type="file" accept=".json,application/json" hidden /></label>
          <span class="keys">Space GO · Esc STOP · R RESET</span>
        </footer>
      </aside>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
